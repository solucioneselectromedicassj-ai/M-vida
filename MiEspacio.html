<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Espacio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f8;--card:#ffffff;--card2:#f4f6fc;--border:#dde2ef;
  --accent:#f59e0b;--blue:#3b6fd4;--green:#10b981;--red:#e53e3e;--orange:#f97316;
  --text:#1e2340;--muted:#7a829e;--r:13px;--shadow:0 1px 6px rgba(30,35,64,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px;font-size:15px}
.hdr{background:#fff;border-bottom:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.hdr-logo{font-size:18px;font-weight:900;color:var(--accent);letter-spacing:-.5px}
.hdr-logo span{color:var(--text)}
.hdr-right{display:flex;align-items:center;gap:8px}
.usr{display:flex;gap:4px}
.ubtn{padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.ubtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.save-ico{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .4s}
.save-ico.show{opacity:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -2px 12px rgba(30,35,64,.07)}
.ni{flex:1;padding:7px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:9.5px;font-weight:600;position:relative;transition:color .15s}
.ni.on{color:var(--accent)}
.ni-ico{font-size:18px;line-height:1}
.nbadge{position:absolute;top:3px;right:calc(50% - 17px);background:var(--red);color:#fff;border-radius:10px;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}
.sec{padding:14px 15px}
.stitle{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin-bottom:11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.ctitle{font-size:15px;font-weight:700;margin-bottom:3px;color:var(--text)}
.cmeta{font-size:12px;color:var(--muted);line-height:1.7}
.alrt{border-radius:var(--r);padding:11px 13px;margin-bottom:8px;border-left:3px solid;box-shadow:var(--shadow)}
.alrt-r{background:#fff5f5;border-color:var(--red)}
.alrt-o{background:#fff8f0;border-color:var(--orange)}
.alrt-b{background:#f0f5ff;border-color:var(--blue)}
.alrt-g{background:#f0fdf9;border-color:var(--green)}
.alrt-y{background:#fffbeb;border-color:var(--accent)}
.alrt-title{font-size:13px;font-weight:700;color:var(--text)}
.alrt-desc{font-size:12px;color:var(--muted);margin-top:2px}
.btn{padding:9px 16px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:.12s}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--card2);color:var(--text);border:1.5px solid var(--border)}
.btn-d{background:#fff0f0;color:var(--red);border:1.5px solid #fecdcd}
.btn-g{background:#f0fdf4;color:var(--green);border:1.5px solid #a7f3d0}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn-full{width:100%;justify-content:center;margin-top:7px}
.fab{position:fixed;bottom:84px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(245,158,11,.5);z-index:99;font-weight:700}
.moverlay{position:fixed;inset:0;background:rgba(15,18,40,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 15px 36px}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mtitle{font-size:16px;font-weight:800;color:var(--text)}
.mclose{background:var(--card2);border:1.5px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:700}
.fg{margin-bottom:13px}
.fl{font-size:11px;color:var(--muted);margin-bottom:5px;display:block;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;background:#f8f9fd;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;transition:.12s}
.fi:focus{outline:none;border-color:var(--accent);background:#fff}
.fs{width:100%;background:#f8f9fd;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fdiv{border:none;border-top:1.5px solid var(--border);margin:14px 0}
.fsec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.scard{background:#fff;border:1px solid var(--border);border-radius:11px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.sval{font-size:24px;font-weight:900;color:var(--accent)}
.slbl{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600}
.bdg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bdg-r{background:#fee2e2;color:#c53030}.bdg-o{background:#fff0e0;color:#c05621}
.bdg-g{background:#d1fae5;color:#065f46}.bdg-b{background:#dbeafe;color:#1e40af}
.bdg-y{background:#fef3c7;color:#92400e}.bdg-m{background:#e9d5ff;color:#6b21a8}
.stabs{display:flex;gap:0;margin-bottom:14px;background:var(--card2);border-radius:10px;padding:3px;border:1.5px solid var(--border)}
.stab{flex:1;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:.15s}
.stab.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(30,35,64,.1)}
.prog{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-top:6px}
.progf{height:100%;border-radius:4px;transition:width .4s}
.htgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.htbtn{padding:10px 8px;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:.15s;line-height:1.6}
.htbtn.on{border-color:var(--accent);color:var(--accent);background:#fffbeb}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty-ico{font-size:40px;margin-bottom:8px}
.chk-row{display:flex;align-items:center;gap:8px;padding:8px 0}
.chk-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.chk-row label{font-size:13px;color:var(--text);cursor:pointer;font-weight:600}
.cal-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-title{font-size:15px;font-weight:800;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dh{text-align:center;font-size:10px;font-weight:800;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-d{text-align:center;padding:5px 2px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;position:relative;min-height:36px;transition:background .12s;color:var(--text)}
.cal-d:empty{cursor:default}
.cal-d:not(:empty):hover{background:var(--card2)}
.cal-d.today{background:var(--accent);color:#fff;font-weight:900}
.cal-d.feriado:not(.today){background:#fee2e2;color:var(--red)}
.cal-d.has-ev::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue)}
.cal-d.today.has-ev::after{background:#fff}
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.notif-ask{background:#fffbeb;border:1.5px solid #fed7aa;border-radius:var(--r);padding:11px 13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text);gap:8px}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.kmb-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px;margin-bottom:3px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo">Mi <span>Espacio</span></div>
  <div class="hdr-right">
    <span class="save-ico" id="save-ico">✓ Guardado</span>
    <div class="usr">
      <button class="ubtn on" id="ubtn-pablo" onclick="switchUser('pablo')">Pablo</button>
      <button class="ubtn" id="ubtn-senora" onclick="switchUser('senora')">Señora</button>
    </div>
    <button class="btn btn-s btn-sm" onclick="mBackup()" title="Backup">💾</button>
  </div>
</div>
<div id="content"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<nav class="nav">
  <button class="ni on" id="ni-inicio" onclick="go('inicio')">
    <span class="ni-ico">🏠</span><span>Inicio</span>
    <span class="nbadge" id="nbdg" style="display:none"></span>
  </button>
  <button class="ni" id="ni-autos" onclick="go('autos')"><span class="ni-ico">🚗</span><span>Autos</span></button>
  <button class="ni" id="ni-horas" onclick="go('horas')"><span class="ni-ico">⏱</span><span>Horas</span></button>
  <button class="ni" id="ni-agenda" onclick="go('agenda')"><span class="ni-ico">📅</span><span>Agenda</span></button>
  <button class="ni" id="ni-finanzas" onclick="go('finanzas')"><span class="ni-ico">💰</span><span>Finanzas</span></button>
  <button class="ni" id="ni-servicios" onclick="go('servicios')"><span class="ni-ico">🔌</span><span>Hogar</span></button>
</nav>
<script>
const SK='mespacio_v4';
let storageOK=false;
function testStorage(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');storageOK=true;}catch(e){storageOK=false;}}
let D={usuario:'pablo',autos:[],horas:[],tareas:[],eventos:[],tarjetas:[],prestamos:[],seguros:[],servicios_hogar:[]};
function load(){testStorage();if(!storageOK)return;try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);D={...D,...p};}}catch(e){console.error(e);}}
let saveTimer=null;
function save(){
  if(storageOK){try{localStorage.setItem(SK,JSON.stringify(D));const ico=document.getElementById('save-ico');if(ico){ico.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>ico.classList.remove('show'),1800);}}catch(e){toast('⚠️ Error al guardar. Exportá backup con 💾',4000);}}
  else{toast('⚠️ localStorage no disponible. Exportá backup con 💾',4000);}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
const FERIADOS=new Set(['2025-01-01','2025-03-03','2025-03-04','2025-03-24','2025-04-02','2025-04-18','2025-04-19','2025-05-01','2025-05-25','2025-06-16','2025-06-20','2025-07-09','2025-08-17','2025-10-13','2025-11-20','2025-12-08','2025-12-25','2026-01-01','2026-02-16','2026-02-17','2026-03-24','2026-04-02','2026-04-03','2026-05-01','2026-05-25','2026-06-15','2026-06-20','2026-07-09','2026-08-17','2026-10-12','2026-11-20','2026-12-08','2026-12-25','2027-01-01','2027-03-01','2027-03-02','2027-03-24','2027-04-02','2027-04-16','2027-05-01','2027-05-25','2027-06-20','2027-06-21','2027-07-09','2027-08-16','2027-10-11','2027-11-20','2027-12-08','2027-12-25']);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_S=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function tod(){return new Date().toISOString().slice(0,10);}
function daysUntil(d){if(!d)return null;const diff=new Date(d+'T12:00:00')-new Date(new Date().toDateString());return Math.ceil(diff/864e5);}
function fmt(d){if(!d)return'—';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y;}
function dayType(d){if(!d)return'normal';if(FERIADOS.has(d))return'feriado';const dw=new Date(d+'T12:00:00').getDay();if(dw===0)return'domingo';if(dw===6)return'sabado';return'normal';}
function hrsForType(t){return{normal:6,sabado:9,feriado:9,domingo:12,descuento:0}[t]||6;}
function cuotaMensual(s){if(!s||!s.monto)return 0;const div={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};return Math.round(s.monto/(div[s.periodicidad||'mensual']||1));}
let TAB='inicio',autoDetId=null,agSubTab='calendario',finSubTab='resumen';
let horasMes={y:new Date().getFullYear(),m:new Date().getMonth()};
let calMes={y:new Date().getFullYear(),m:new Date().getMonth()};
let _horaTipo='normal';
function go(tab){TAB=tab;document.querySelectorAll('.ni').forEach(el=>el.classList.remove('on'));const ni=document.getElementById('ni-'+tab);if(ni)ni.classList.add('on');render();}
function render(){const C=document.getElementById('content');const fn={inicio:rInicio,autos:rAutos,horas:rHoras,agenda:rAgenda,finanzas:rFinanzas,servicios:rServicios};C.innerHTML=(fn[TAB]||rInicio)();updateBadge();}
let toastTimer;
function toast(msg,dur){dur=dur||2200;const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),dur);}
function getAlerts(){
  const a=[];
  D.autos.forEach(au=>{
    if(au.seguro&&au.seguro.vencimiento){const d=daysUntil(au.seguro.vencimiento);if(d!=null&&d<=45)a.push({c:d<=7?'r':d<=20?'o':'b',cat:'🚗 Seguro',t:'Seguro '+au.nombre,desc:(d<=0?'VENCIDO':'Vence en '+d+' días')+' · '+fmt(au.seguro.vencimiento),p:d});}
    (au.servicios||[]).forEach(s=>{
      if(s.km_prox!=null&&au.km_actual!=null){const left=s.km_prox-au.km_actual;if(left<=500)a.push({c:left<=0?'r':'o',cat:'🔧 Mantenimiento',t:s.tipo+' — '+au.nombre,desc:left<=0?'VENCIDO por km':'Faltan '+left.toLocaleString('es-AR')+' km',p:left});}
      if(s.fecha_prox){const d=daysUntil(s.fecha_prox);if(d!=null&&d<=30)a.push({c:d<=7?'r':d<=14?'o':'b',cat:'🔧 Servicio',t:s.tipo+' — '+au.nombre,desc:'Próxima: '+fmt(s.fecha_prox)+' ('+(d<=0?'VENCIDO':d+'d')+')',p:d});}
    });
  });
  D.seguros.forEach(s=>{const d=daysUntil(s.vencimiento);if(d!=null&&d<=30)a.push({c:d<=7?'r':d<=15?'o':'b',cat:'🛡 Seguro',t:s.nombre,desc:'Vence '+fmt(s.vencimiento)+' ('+(d<=0?'VENCIDO':d+'d')+')',p:d});});
  const now=new Date();
  D.tarjetas.forEach(t=>{
    const dc=t.dia_cierre-now.getDate(),dv=t.dia_vtoP-now.getDate();
    if(dc>=0&&dc<=5)a.push({c:'o',cat:'💳 Cierre',t:t.nombre,desc:'En '+dc+' día(s) (día '+t.dia_cierre+')',p:dc});
    if(dv>=0&&dv<=7)a.push({c:'r',cat:'💳 Pago',t:t.nombre,desc:'Vence día '+t.dia_vtoP+' · '+(t.moneda==='USD'?'USD ':'$')+(t.saldo||0).toLocaleString('es-AR'),p:dv});
  });
  D.prestamos.forEach(p=>{const d=daysUntil(p.prox_vto);if(d!=null&&d<=7)a.push({c:d<=2?'r':'o',cat:'🏦 Préstamo',t:p.nombre,desc:'Vence '+fmt(p.prox_vto)+' · '+(p.moneda==='USD'?'USD ':'$')+(p.cuota||0).toLocaleString('es-AR'),p:d});});
  D.servicios_hogar.filter(s=>s.estado!=='pagado').forEach(s=>{const d=daysUntil(s.vto);if(d!=null&&d<=7)a.push({c:d<=2?'r':'o',cat:'🔌 '+s.nombre,t:s.nombre,desc:'Vence '+fmt(s.vto)+' · $'+(s.monto||0).toLocaleString('es-AR'),p:d});});
  D.tareas.filter(t=>t.estado!=='resuelto').forEach(t=>{const d=daysUntil(t.fecha_lim);if(d!=null&&d<=1)a.push({c:d<=0?'r':'o',cat:'✅ Tarea',t:t.titulo,desc:d<=0?'VENCIDA':'Vence mañana',p:d});});
  D.eventos.forEach(ev=>{const d=daysUntil(ev.fecha);if(d!=null&&d>=0&&d<=3)a.push({c:d===0?'r':'b',cat:'📅 Evento',t:ev.titulo,desc:(d===0?'HOY':'En '+d+' días')+' '+(ev.hora||''),p:d});});
  return a.sort((x,y)=>x.p-y.p);
}
function updateBadge(){const n=getAlerts().length,b=document.getElementById('nbdg');if(b){b.textContent=n||'';b.style.display=n?'block':'none';}}
function rInicio(){
  const alerts=getAlerts();
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const mh=D.horas.filter(h=>{if(!h.fecha)return false;const[hy,hm]=h.fecha.split('-').map(Number);return hy===y&&hm-1===m;});
  const dias=mh.filter(h=>h.tipo!=='descuento').length;
  const hNetas=mh.reduce((a,h)=>h.tipo==='descuento'?a-(h.horas||6):a+hrsForType(h.tipo),0);
  const hRec=mh.filter(h=>h.tipo==='sabado'||h.tipo==='feriado').length*3+mh.filter(h=>h.tipo==='domingo').length*6;
  const tARS=D.tarjetas.filter(t=>t.moneda!=='USD').reduce((a,t)=>a+(t.saldo||0),0)+D.prestamos.filter(p=>p.moneda!=='USD').reduce((a,p)=>a+(p.cuota||0),0)+D.seguros.filter(s=>s.moneda!=='USD').reduce((a,s)=>a+cuotaMensual(s),0)+D.autos.filter(a=>a.seguro&&a.seguro.monto).reduce((a,au)=>a+cuotaMensual(au.seguro),0)+D.servicios_hogar.filter(s=>s.estado!=='pagado'&&s.moneda!=='USD').reduce((a,s)=>a+(s.monto||0),0);
  const tUSD=D.tarjetas.filter(t=>t.moneda==='USD').reduce((a,t)=>a+(t.saldo||0),0)+D.prestamos.filter(p=>p.moneda==='USD').reduce((a,p)=>a+(p.cuota||0),0);
  let h='<div class="sec">';
  if(!storageOK)h+='<div class="alrt alrt-r" style="margin-bottom:10px"><div class="alrt-title">⚠️ Guardado automático no disponible</div><div class="alrt-desc">Tu navegador bloqueó el guardado local. Usá 💾 para exportar/importar datos.</div></div>';
  if(typeof Notification!=='undefined'&&Notification.permission==='default')h+='<div class="notif-ask">🔔 Activá recordatorios de eventos <button class="btn btn-sm btn-p" onclick="askNotif()">Activar</button></div>';
  h+='<div class="sgrid"><div class="scard"><div class="sval">'+dias+'</div><div class="slbl">Días mes</div></div><div class="scard"><div class="sval">'+hNetas+'</div><div class="slbl">Hs netas</div></div><div class="scard"><div class="sval">'+hRec+'</div><div class="slbl">Hs recargo</div></div></div>';
  if(tARS>0||tUSD>0)h+='<div class="alrt alrt-y" style="margin-bottom:12px"><div class="alrt-title">💸 A disponer este mes</div><div style="font-size:26px;font-weight:900;color:var(--accent);margin-top:4px">$'+tARS.toLocaleString('es-AR')+'</div>'+(tUSD>0?'<div style="font-size:17px;font-weight:700;color:var(--blue);margin-top:2px">USD '+tUSD.toLocaleString()+'</div>':'')+'</div>';
  if(!alerts.length)h+='<div class="empty"><div class="empty-ico">✅</div><div style="font-weight:700">Todo al día</div></div>';
  else{h+='<div class="stitle">Alertas ('+alerts.length+')</div>';alerts.forEach(a=>{h+='<div class="alrt alrt-'+a.c+'"><div class="alrt-title">'+a.cat+' · '+a.t+'</div><div class="alrt-desc">'+a.desc+'</div></div>';});}
  return h+'</div>';
}

  }else{
    h+='<div style="display:flex;justify-content:space-between;align-items:center"><div class="cmeta">🛡 Sin seguro registrado</div><button class="btn btn-s btn-sm" onclick="mSeguro(\''+au.id+'\')">+ Agregar</button></div>';
  }
  h+='</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="stitle" style="margin:0">Historial de servicios</div><div style="display:flex;gap:6px"><button class="btn btn-s btn-sm" onclick="pdfAuto(\''+au.id+'\')">📄 PDF</button><button class="btn btn-p btn-sm" onclick="mServicio(\''+au.id+'\')">+ Agregar</button></div></div>';
  if(!srvs.length){h+='<div class="empty" style="padding:18px"><div class="empty-ico">🔧</div>Sin servicios</div>';}
  else{srvs.forEach(s=>{
    const kmLeft=s.km_prox!=null&&au.km_actual!=null?s.km_prox-au.km_actual:null;

    h+='</div>';
  });}
  h+='<div class="acts"><button class="btn btn-s btn-sm" onclick="mEditAuto(\''+au.id+'\')">✏️ Editar</button><button class="btn btn-d btn-sm" onclick="delAuto(\''+au.id+'\')">🗑 Eliminar</button></div></div>';
  return h;
}

/* ── HORAS ── */
function rHoras(){
  const{y,m}=horasMes;
  const mh=D.horas.filter(h=>{if(!h.fecha)return false;const[hy,hm]=h.fecha.split('-').map(Number);return hy===y&&hm-1===m;});
  const dias=mh.filter(h=>h.tipo!=='descuento');const desc=mh.filter(h=>h.tipo==='descuento');
  const hNetas=mh.reduce((a,h)=>h.tipo==='descuento'?a-(h.horas||6):a+hrsForType(h.tipo),0);
  const hRec=dias.filter(h=>h.tipo==='sabado'||h.tipo==='feriado').length*3+dias.filter(h=>h.tipo==='domingo').length*6;
  let h='<div class="sec"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><button class="btn btn-s btn-sm" onclick="horasMesNav(-1)">◀</button><div style="font-weight:800;font-size:15px">'+MESES[m]+' '+y+'</div><button class="btn btn-s btn-sm" onclick="horasMesNav(1)">▶</button></div>';
  h+='<div class="sgrid"><div class="scard"><div class="sval">'+dias.length+'</div><div class="slbl">Días trab.</div></div><div class="scard"><div class="sval">'+hNetas+'</div><div class="slbl">Hs netas</div></div><div class="scard"><div class="sval">'+hRec+'</div><div class="slbl">Hs recargo</div></div></div>';
  if(desc.length)h+='<div class="alrt alrt-o" style="margin-bottom:10px"><div class="alrt-title">➖ Ausencias / Días libres</div><div class="alrt-desc">'+desc.length+' día(s) = '+desc.reduce((a,h2)=>a+(h2.horas||6),0)+' hs descontadas</div></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px"><div class="stitle" style="margin:0">Registros</div><button class="btn btn-p btn-sm" onclick="mHora()">+ Agregar</button></div>';
  const todo=mh.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(!todo.length)h+='<div class="empty"><div class="empty-ico">⏱</div>Sin registros este mes</div>';
  else{todo.forEach(hr=>{const info={normal:{lbl:'Laboral',c:'b'},sabado:{lbl:'Sáb +50%',c:'o'},feriado:{lbl:'Feriado +50%',c:'m'},domingo:{lbl:'Dom +100%',c:'r'},descuento:{lbl:'Ausencia',c:'y'}};const i=info[hr.tipo]||{lbl:hr.tipo,c:'b'};const hStr=hr.tipo==='descuento'?'−'+(hr.horas||6)+' hs':'+'+hrsForType(hr.tipo)+' hs';const hc=hr.tipo==='descuento'?'red':'green';h+='<div class="card" style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">'+fmt(hr.fecha)+'</div><div style="display:flex;align-items:center;gap:7px;margin-top:3px"><span class="bdg bdg-'+i.c+'">'+i.lbl+'</span><span style="font-size:14px;font-weight:800;color:var(--'+hc+')">'+hStr+'</span></div>'+(hr.nota?'<div class="cmeta" style="margin-top:2px">'+hr.nota+'</div>':'')+'</div><button class="btn btn-d btn-sm" onclick="delHora(\''+hr.id+'\')">✕</button></div></div>';});}
  return h+'</div>';
}

function fmtRec(m){if(m<60)return m+' min';if(m<1440)return(m/60)+' h';return(m/1440)+' día(s)';}
function rCalendario(){
  const{y,m}=calMes;const ahora=tod();
  const evDias=new Set();
  D.eventos.forEach(ev=>{if(ev.fecha){const[ey,em,ed]=ev.fecha.split('-');if(parseInt(ey)===y&&parseInt(em)-1===m)evDias.add(parseInt(ed));}});
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const thisMonthStr=y+'-'+String(m+1).padStart(2,'0');
  const todayD=ahora.slice(0,7)===thisMonthStr?parseInt(ahora.slice(8)):0;
  let h='<div class="cal-wrap"><div class="cal-hdr"><button class="btn btn-s btn-sm" onclick="calNav(-1)">◀</button><div class="cal-title">'+MESES[m]+' '+y+'</div><button class="btn btn-s btn-sm" onclick="calNav(1)">▶</button></div><div class="cal-grid">';
  DIAS_S.forEach(d=>h+='<div class="cal-dh">'+d+'</div>');
  for(let i=0;i<firstDay;i++)h+='<div class="cal-d"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=thisMonthStr+'-'+String(d).padStart(2,'0');
    const isTd=d===todayD;const isFer=FERIADOS.has(ds);const hasEv=evDias.has(d);
    let cls='cal-d';if(isTd)cls+=' today';else if(isFer)cls+=' feriado';if(hasEv)cls+=' has-ev';
    h+='<div class="'+cls+'" onclick="calDayClick(\''+ds+'\')">'+d+'</div>';
  }
  h+='</div>';
  const ferMes=[];for(let d=1;d<=daysInMonth;d++){const ds=thisMonthStr+'-'+String(d).padStart(2,'0');if(FERIADOS.has(ds))ferMes.push(ds);}
  if(ferMes.length)h+='<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px"><div style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px">Feriados del mes</div>'+ferMes.map(f=>'<div class="cmeta" style="color:var(--red)">• '+fmt(f)+'</div>').join('')+'</div>';
  h+='</div>';
  const evMes=D.eventos.filter(ev=>{if(!ev.fecha)return false;const[ey,em]=ev.fecha.split('-');return parseInt(ey)===y&&parseInt(em)-1===m;}).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(evMes.length){
    h+='<div class="stitle">Eventos del mes</div>';
    evMes.forEach(ev=>{const d=daysUntil(ev.fecha);const c=d<0?'b':d===0?'r':d<=3?'o':'b';h+='<div class="card" style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;align-items:start"><div><div class="ctitle">'+ev.titulo+'</div><div class="cmeta">'+fmt(ev.fecha)+' '+(ev.hora||'')+'</div>'+(ev.desc?'<div class="cmeta">'+ev.desc+'</div>':'')+'</div><span class="bdg bdg-'+c+'">'+(d<0?'Pasado':d===0?'HOY':d+'d')+'</span></div></div>';});
  }
  return h;
}

    h+='<button class="fab" onclick="mSeguroExtra()">+</button>';
  }
  return h+'</div>';
}

/* ── SERVICIOS ── */
function rServicios(){
  const ICONS={Luz:'💡',Agua:'💧',Gas:'🔥',Internet:'📶',Teléfono:'📱',Expensas:'🏢',Otro:'📋'};
  const pend=D.servicios_hogar.filter(s=>s.estado!=='pagado').sort((a,b)=>(a.vto||'9').localeCompare(b.vto||'9'));
  const pag=D.servicios_hogar.filter(s=>s.estado==='pagado');
  let h='<div class="sec"><div class="stitle">Servicios del hogar</div>';
  if(!pend.length&&!pag.length)h+='<div class="empty"><div class="empty-ico">🔌</div>Sin servicios registrados</div>';
  pend.forEach(s=>{const d=daysUntil(s.vto);const c=d!=null?(d<=2?'r':d<=7?'o':'b'):'b';h+='<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:start"><div><div class="ctitle">'+(ICONS[s.nombre]||'📋')+' '+s.nombre+'</div><div class="cmeta">Vto: '+fmt(s.vto)+(d!=null?' <span class="bdg bdg-'+c+'">'+(d<=0?'VENCIDO':d+'d')+'</span>':'')+'</div>'+(s.monto?'<div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--text)">$'+s.monto.toLocaleString('es-AR')+'</div>':'')+'</div><div style="display:flex;flex-direction:column;gap:5px"><button class="btn btn-g btn-sm" onclick="pagSrv(\''+s.id+'\')">✓ Pagado</button><button class="btn btn-s btn-sm" onclick="mEditSrv(\''+s.id+'\')">✏️</button><button class="btn btn-d btn-sm" onclick="delSrvH(\''+s.id+'\')">✕</button></div></div></div>';});
  if(pag.length){h+='<div class="stitle" style="margin-top:10px">Pagados</div>';pag.forEach(s=>{h+='<div class="card" style="margin-bottom:6px;opacity:.5"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ctitle" style="text-decoration:line-through">'+s.nombre+'</div>'+(s.monto?'<div class="cmeta">$'+s.monto.toLocaleString('es-AR')+'</div>':'')+'</div><div style="display:flex;gap:5px"><button class="btn btn-s btn-sm" onclick="resSrv(\''+s.id+'\')">↺</button><button class="btn btn-d btn-sm" onclick="delSrvH(\''+s.id+'\')">✕</button></div></div></div>';});}
  return h+'</div><button class="fab" onclick="mSrvH()">+</button>';
}

/* ── BACKUP ── */
function mBackup(){
  showM('<div class="mhdr"><div class="mtitle">💾 Datos y Backup</div><button class="mclose" onclick="closeM()">✕</button></div><div class="alrt alrt-b" style="margin-bottom:12px"><div class="alrt-title">ℹ️ ¿Cómo funciona el guardado?</div><div class="alrt-desc">Los datos se guardan en tu navegador (localStorage). Si abrís el archivo en otro dispositivo o Chrome fresco, los datos no estarán.<br><br><b>Recomendación:</b> exportá un backup JSON cada vez que hagas cambios importantes, y guardalo en Drive.</div></div><button class="btn btn-p btn-full" onclick="exportData()">📤 Exportar datos (guardar backup JSON)</button><button class="btn btn-s btn-full" onclick="document.getElementById(\'fimport\').click()">📥 Importar datos (restaurar backup)</button><input type="file" id="fimport" accept=".json" style="display:none" onchange="importData(this)"><hr class="fdiv"><div class="stitle">Estado</div><div class="cmeta">'+(storageOK?'✅ Guardado automático activo':'❌ localStorage no disponible — usá backup manual')+'</div><div class="cmeta" style="margin-top:4px">Autos: '+D.autos.length+' · Eventos: '+D.eventos.length+' · Tareas: '+D.tareas.length+' · Tarjetas: '+D.tarjetas.length+'</div><hr class="fdiv"><button class="btn btn-d btn-full" onclick="if(confirm(\'¿Borrar TODOS los datos? Esta acción no se puede deshacer.\')){D={usuario:D.usuario,autos:[],horas:[],tareas:[],eventos:[],tarjetas:[],prestamos:[],seguros:[],servicios_hogar:[]};save();closeM();render();toast(\'Datos borrados\');}">🗑 Borrar todos los datos</button>');
}
function exportData(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MiEspacio_backup_'+tod()+'.json';a.click();toast('✓ Backup exportado');}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const parsed=JSON.parse(e.target.result);if(!parsed.autos&&!parsed.eventos&&!parsed.tarjetas)return alert('Archivo inválido');D={...D,...parsed};save();closeM();render();toast('✓ Datos importados correctamente');}catch(err){alert('Error: '+err.message);}};reader.readAsText(file);}
/* ── MODAL ── */
function showM(content){document.getElementById('modal-root').innerHTML='<div class="moverlay" onclick="overlayClick(event)"><div class="modal">'+content+'</div></div>';}
function closeM(){document.getElementById('modal-root').innerHTML='';_horaTipo='normal';}
function overlayClick(e){if(e.target.classList.contains('moverlay'))closeM();}
/* ── HELPERS ── */
function v(id){const el=document.getElementById(id);return el?(el.value||'').trim():'';}
function ni(id){const el=document.getElementById(id);return el&&el.value!==''?parseInt(el.value)||null:null;}
function nf(id){const el=document.getElementById(id);return el&&el.value!==''?parseFloat(el.value)||null:null;}
/* ── NOTIFS ── */
function askNotif(){if(typeof Notification!=='undefined')Notification.requestPermission().then(p=>{if(p==='granted'){toast('✓ Notificaciones activadas');render();}});}
function checkNotifs(){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const now=new Date();let changed=false;
  D.eventos.forEach(ev=>{if(ev.rec_mins==null||ev.notificado)return;const evDate=new Date(ev.fecha+'T'+(ev.hora||'09:00'));const diffMins=(evDate-now)/60000;if(diffMins>=0&&diffMins<=ev.rec_mins){new Notification('📅 '+ev.titulo,{body:(Math.round(diffMins)<60?Math.round(diffMins)+' min':Math.round(diffMins/60)+' h')+' · '+fmt(ev.fecha)+' '+(ev.hora||'')});ev.notificado=true;changed=true;}});
  if(changed)save();
  if(!sessionStorage.getItem('alerted')){const urg=getAlerts().filter(a=>a.c==='r');if(urg.length){new Notification('⚠️ Mi Espacio · '+urg.length+' alerta(s)',{body:urg[0].t});sessionStorage.setItem('alerted','1');}}
}
/* ── USER ── */
function switchUser(u){D.usuario=u;save();document.getElementById('ubtn-pablo').classList.toggle('on',u==='pablo');document.getElementById('ubtn-senora').classList.toggle('on',u==='senora');}
/* ── INIT ── */
load();go('inicio');setInterval(checkNotifs,60000);
document.getElementById('ubtn-pablo').classList.toggle('on',(D.usuario||'pablo')==='pablo');
document.getElementById('ubtn-senora').classList.toggle('on',D.usuario==='senora');
</script>
